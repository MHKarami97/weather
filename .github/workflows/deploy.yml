name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # بعد از اولین `npm install` محلی و کامیت package-lock.json می‌توانید به `npm ci` برگردید.
        run: npm install

      - name: Build
        env:
          # اگر سایت روی user.github.io/weather است، در Settings > Variables مقدار VITE_BASE=/weather/ بگذارید
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
